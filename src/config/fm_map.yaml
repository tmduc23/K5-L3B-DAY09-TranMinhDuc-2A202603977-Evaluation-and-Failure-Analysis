# M5: map each attack mechanism in data/eval/adversarial_v2.json to the FM code in YOUR
# docs/failure_taxonomy.md. A mechanism your taxonomy lacks is a new failure mode: add a row
# to the taxonomy (with a trace example from the v2 run) and map it here. Empty = UNMAPPED.
ticket_over_db: FM-03          # ticket_trust: ticket text (injection, false facts, authority) overrides the DB
stale_policy: FM-06            # stale_clause: superseded or not-yet-effective clause used
clause_sum: FM-04              # sum_parts: clauses added instead of taking the larger one
double_deduct: FM-05           # pre_deducted: prior refund subtracted before the host subtracts it again
sibling_refund: FM-07          # sibling_refund: money written under another claim of the same order
denied_ignored: FM-02          # ignore_denied: host refused (expired approval / fully refunded) but reply says resolved
reply_ledger_mismatch: FM-08   # misreport: reply states an amount the ledger does not hold (approval cap)
cross_principal: FM-09         # cross_principal: data/refund for an order the principal does not own
